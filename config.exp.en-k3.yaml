# EXPERIMENT: multi-take EN audio, so `qc/compare.py` can ask of English the
# question it just asked of Russian.
#
# The ru comparison round (FINDINGS 2.1n) found qc_f0st the only feature above
# chance at 12/24 (p 0.068) and qc_mos_min AT OR BELOW chance once segment
# length was controlled. n=24 cannot settle it, and everything on disk for en
# is single-take: only 6 en segments have more than one take, against 46 for ru.
#
# So this generates the missing asset — 3 takes of ONE config per segment, same
# sentence, dice-only variation — and nothing else. No grid, no tune, no engine
# comparison: those all vary something, and the whole point is that only the
# random seed differs.
#
# DURABLE. Once this audio exists, en comparison pages are free forever; the
# 2.1n analysis needed no GPU at all, only takes to compare.
tts:
  variant_label: en-k3

bakeoff:
  engines: [qwen]
  takes: 3              # 3-way groups -> chance 1/3, same as the ru page
  subset_size: 46       # every segment; qc.compare drops those under 5 s itself
  tune:
    enabled: false      # a param sweep would vary config, which is the one
                        # thing that must NOT vary here
