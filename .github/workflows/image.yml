name: pod-image

# Builds the prebuilt RunPod image (docker/Dockerfile) and pushes it to GHCR,
# tagged by the lock it was built from. The pod only uses it when the tag's
# lock matches the project's uv.lock (REMOTE_SETUP checks the stamp), so an
# old image is never silently used against a new lock.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [uv.lock, pyproject.toml, docker/**, .github/workflows/image.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # base image (~10 GB) + torch + weights overflow the runner's free disk
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: tag from uv.lock
        id: tag
        run: echo "tag=lock-$(sha256sum uv.lock | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dubadabidu-pod:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/dubadabidu-pod:latest
