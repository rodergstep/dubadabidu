# EXPERIMENT: characterise 0.6B's spread properly.
#
# The blind pass hinted 0.6B is the CONSISTENT model — sd 0.48 against 0.83/0.93
# for the two 1.7B variants, and no take below 3 — but that was 8 ratings from
# 3 takes per segment. mos± on the earlier 0.6B row (0.454) came from 3 takes,
# which is barely an estimate of a standard deviation.
#
# Six takes gives a real mos±, its own best_of curve, and enough material for a
# second blind page. If 0.6B's spread is genuinely tighter, best_of can be lower
# FOR THAT MODEL — the two settings interact, and cost is takes x s/take.
tts:
  qwen_model_dir: Qwen/Qwen3-TTS-12Hz-0.6B-Base
  variant_label: bo6

bakeoff:
  takes: 6
  tune:
    enabled: false
