# EXPERIMENT: does 0.6B's win hold in Russian?
#
# In English 0.6B beat 1.7B on mos (2.692 vs 2.340) and wer (0.002 vs 0.018),
# both far outside the measured noise floor, while losing sim (0.629 vs 0.665).
# That contradicts upstream, which documents 0.6B as the weaker model — so the
# result needs a second language before it can drive a config change.
#
# ru is the better test than en: it already clones markedly better (sim 0.774 vs
# 0.681), so if 0.6B's sim penalty is a constant it should still land above
# English's best, and if the penalty scales it will show clearly.
tts:
  qwen_model_dir: Qwen/Qwen3-TTS-12Hz-0.6B-Base

bakeoff:
  tune:
    enabled: false
