# EXPERIMENT: does qwen honour REDUCTION RESPELLING as a stress cue?
#
# The last untried remediation for wrong Russian stress. 2.1b/2.1bb refuted
# feeding qwen combining acutes (U+0301) — it was never trained on them and
# reads them as content, 97% of clips unusable. That refutation is about a
# DIACRITIC. This writes ordinary Cyrillic instead: unstressed о as а, е as и,
# so the stressed vowel is the only unreduced one.
#
#   молоко -> малако      натюрморте -> натюрморти
#   белилам -> билилам    стронциановая -> странцианавая
#
# TARGETED: only the 9 forms a native listener marked (stress_lexicon_ru.json).
# A failure costs those words, not the track.
#
# THE CONTROL is config.exp.ru-control.yaml — same overlay stack, no respell,
# and a variant_label so the two rows cannot merge. Run both, then compare BY
# EAR on a qc/compare page: no metric here can hear stress (2.1f measured WER at
# AUC 0.647, and four detectors failed), so the scorecard cannot settle this.
#
# KNOWN LIMIT, worth reading before believing a null result: RUAccent is the
# stress oracle and it is context-free, so `цвета` — the most-marked word, 3 of
# 13 — comes back unchanged, because it reads the genitive singular where the
# text means the nominative plural. Respelling cannot fix a word whose oracle
# disagrees about the target.
tts:
  variant_label: respell
  ru_respell: true      # THE axis under test — nothing else may differ
  ru_stress: false      # mutually exclusive; normalize_for_tts enforces it too

bakeoff:
  tune:
    enabled: false
