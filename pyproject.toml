[project]
name = "dubadabidu"
version = "0.4.0"
description = "Ukrainian -> multilingual AI video dubbing with voice cloning (Chatterbox Multilingual v3)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "faster-whisper==1.2.1",
  "demucs==4.1.0",
  # torch/torchaudio are pinned 2.6.0 by the pod bootstrap (runpod_infra
  # REMOTE_SETUP). They used to arrive via the `clone` extra (chatterbox-tts),
  # which was removed with chatterbox on 2026-08-02 — the pin is ours now.
  "edge-tts==7.2.8",
  "srt==3.5.3",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "pydub==0.25.1",
  "openai==2.45.0",
  "jiwer",
  "num2words",            # digit->word expansion in backcheck WER normalization
  "speechbrain==1.1.0",   # ECAPA-TDNN speaker similarity (qc), Apache-2.0
  "ruaccent==1.5.8.3",    # Russian stress marking pre-TTS, Apache-2.0
  "distillmos==0.9.1",    # neural MOS naturalness proxy (qc), MIT
  "pyyaml",
]

[project.optional-dependencies]
# RoFormer separation backend (s1, local-only: the remote flow runs s1/s2 on the
# Mac, so pods install plain .[dev]). [cpu] only picks the onnxruntime flavor —
# RoFormer ckpts run on torch and auto-use CUDA/MPS either way.
# CAUTION: when combined with `clone`, install with explicit torch/numpy pins
# on the same command line or the resolver moves torch 2.6.0 (see requirements.txt).
# 0.30.2 = the numpy<2 ceiling forced by chatterbox; 0.44.3 needs numpy>=2.
sep = ["audio-separator[cpu]==0.30.2"]
# Apple-Silicon-only ASR accel: Whisper via MLX (Metal/ANE), ~4-5x vs CPU int8.
# mlx is macOS/arm64-only — keep it OUT of core requirements (it won't resolve on
# the Linux CUDA box, which auto-uses faster-whisper anyway).
mac = ["mlx-whisper"]
# s6 mastering chain (mix.master.enabled). pedalboard is GPLv3 — kept opt-in so
# the default install stays permissive; it only processes audio, so the mixed
# WAV output is not a derivative and course output stays unencumbered.
master = ["pedalboard"]
dev = ["pytest"]

[project.scripts]
dubadabidu = "dub:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dub"]
packages = ["pipeline", "qc"]
