[project]
name = "dubadabidu"
version = "1.0.0"
description = "Ukrainian -> multilingual AI video dubbing with voice cloning (Qwen3-TTS)"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"   # 3.11 = Mac venv, 3.12 = pod + CI; numpy 2.4 dropped 3.10
dependencies = [
  "faster-whisper==1.2.1",
  # faster-whisper's own av dependency, capped: PyAV 19 removed the
  # metadata_errors argument it passes (see constraint-dependencies below).
  # Declared here as well because [tool.uv] constraints do not travel in the
  # wheel — a plain pip install resolved av 19.0.2 on Linux/py3.12.
  "av<19",
  # torch/torchaudio: DECLARED and LOCKED since v0.5 (uv.lock). On Linux torch
  # resolves from the cu130 index ([tool.uv.sources] below) — the wheel must
  # not need a newer driver than runpod.min_cuda_version admits. On macOS it
  # comes from PyPI. torchaudio is NOT version-locked to torch any more: 2.11.1
  # ships py3-none (stable-ABI) wheels requiring only torch>=2.11, from PyPI on
  # both platforms. BUT the PyPI Linux wheel is the CUDA 13 build
  # (_torchaudio.so links libcudart.so.13), and no cu12x 2.11.1 exists — so on
  # Linux torch must be a cu13x build too. A cu126 torch installed fine and
  # then failed to import qwen on a pod (2026-11-25).
  # Declaring them here also stops audio-separator's unbounded torch>=2.3
  # from pulling whatever is newest.
  "torch==2.14.1",
  "torchaudio==2.11.1",
  "edge-tts==7.3.1",
  "srt==3.5.3",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "pydub==0.25.1",
  "openai==2.52.0",
  "jiwer==4.0.0",
  "num2words==0.5.14",    # digit->word expansion in backcheck WER normalization
  # Russian lexical stress (RUAccent, Apache-2.0, context-aware homographs).
  # Needed wherever SYNTHESIS runs, i.e. the pod, so core rather than an extra.
  # Gated at runtime by tts.ru_stress.
  "ruaccent==1.5.8.3",
  # PINNED, and it is load-bearing. qwen-tts pins transformers==4.57.3 and
  # faster-qwen3-tts requires <5,>=4.57, but neither is a dependency of THIS
  # project — they install later, from runpod.engine_setup. ruaccent declares
  # `transformers` UNPINNED, so adding it (2026-08-03) let pip resolve 5.14.1
  # into .[dev] and the qwen install could no longer be satisfied:
  #     qwen unavailable: faster-qwen3-tts (tts.qwen_fast is on)
  # A whole ru-stress A/B measured nothing and cost a pod. Declaring the version
  # the engine needs makes the constraint explicit instead of emergent.
  "transformers==4.57.3",
  # faster-qwen3-tts (installed later from runpod.engine_setup) requires <1.0;
  # declaring it keeps the lock and the engine install agreeing.
  "huggingface-hub>=0.36,<1.0",
  "speechbrain==1.1.0",   # ECAPA-TDNN speaker similarity (qc), Apache-2.0
  "distillmos==0.9.1",    # neural MOS naturalness proxy (qc), MIT
  "pyyaml==6.0.3",
  "pydantic==2.14.2",   # config schema (pipeline/config_schema.py)
]

[project.optional-dependencies]
# RoFormer separation backend (s1, local-only: the remote flow runs s1/s2 on the
# Mac, so pods install plain .[dev]). [cpu] only picks the onnxruntime flavor —
# RoFormer ckpts run on torch and auto-use CUDA/MPS either way.
# CAUTION, still live: audio-separator declares only `torch>=2.3` with NO upper
# bound, so an unpinned install pulls the newest torch, away from the locked
# one. Always install with torch/torchaudio pinned ON THE SAME COMMAND LINE:
#   uv pip install 'audio-separator[cpu]==0.44.5' torch==2.14.1 torchaudio==2.11.1
# 0.30.2 was the numpy<2 ceiling forced by chatterbox; chatterbox went on
# 2026-08-02 and 0.44.5 requires numpy>=2, so the two moved together.
# Our pinned checkpoint (separation.roformer_model,
# model_bs_roformer_ep_317_sdr_12.9755) is still in 0.44.5's registry — the
# library moved, the model did not, so stems stay comparable.
# WART: 0.44.5 hard-depends on onnx-weekly, a dev-channel build. Upstream's
# choice, not pinnable from here; it is why this stays an OPT-IN extra.
#
# demucs lives HERE, not in core, since 2026-08-03. It is the FALLBACK
# separation backend (separation.backend: demucs) and separation is s1 — a
# stage that runs on the Mac and never on a pod, because the pod is deliberately
# never sent the source video. Every pod bootstrap was nonetheless resolving and
# downloading demucs and its tree (dora-search, julius, lameenc, openunmix) for
# code it cannot reach. `pip install -e '.[dev]'` is on the critical path of
# every fresh pod, so this is pure billed wall clock.
sep = ["audio-separator[cpu]==0.44.5", "demucs==4.1.0"]
# Apple-Silicon-only ASR accel: Whisper via MLX (Metal/ANE), ~4-5x vs CPU int8.
# mlx is macOS/arm64-only — keep it OUT of core requirements (it won't resolve on
# the Linux CUDA box, which auto-uses faster-whisper anyway).
mac = ["mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# s6 mastering chain (mix.master.enabled). pedalboard is GPLv3 — kept opt-in so
# the default install stays permissive; it only processes audio, so the mixed
# WAV output is not a derivative and course output stays unencumbered.
master = ["pedalboard==0.9.24"]
# Offline QC judges (FINDINGS §2.1s: refuted as a take judge; kept to
# reproduce it) — LOCAL only, never on the pod. Meta's
# Audiobox Aesthetics (CC-BY-4.0): per-clip PQ/CE/CU/PC axes.
judge = ["audiobox_aesthetics==0.0.4"]
dev = ["pytest==9.1.1"]   # ruff runs via `uvx ruff@<ver>` (CI), not from the env

[project.scripts]
dubadabidu = "dubadabidu.cli:main"

[build-system]
requires = ["setuptools>=77"]   # 77: SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The product is ONE package, dubadabidu, under src/ (ARCHITECTURE_PLAN.md §2).
# The packages are LISTED (tests/test_packaging.py keeps the list complete).
# research/ and the clone-only pipeline/ and qc/ shims are not shipped.
package-dir = { "dubadabidu" = "src/dubadabidu" }
packages = [
  "dubadabidu",
  "dubadabidu.cli",
  "dubadabidu.core",
  "dubadabidu.core.config",
  "dubadabidu.engines",
  "dubadabidu.infra",
  "dubadabidu.infra.remote",
  "dubadabidu.lab",
  "dubadabidu.qc",
  "dubadabidu.review",
  "dubadabidu.stages",
  "dubadabidu.workflows",
]

[tool.setuptools.package-data]
# the s3 prompt templates, read with importlib.resources
dubadabidu = ["prompts/*.md"]

[tool.pytest.ini_options]
# CI runs pytest without installing the project
pythonpath = ["src", "."]

# torch from the CUDA 13.0 index on Linux (the pod), PyPI elsewhere (the Mac).
# Drivers are backward- but not forward-compatible, so the wheel's CUDA must
# not exceed the oldest driver runpod.min_cuda_version admits (13.0). Asserted
# by tests/test_runpod.py::test_torch_wheel_matches_the_oldest_allowed_driver.
# cu130, not cu12x: torchaudio 2.11.1's Linux wheel needs the CUDA 13 runtime
# (see the dependencies comment). 2.15 exists only as cu132 (13.2 drivers).
# The explicit index keeps the build fixed even if PyPI's default moves.
# torchaudio needs no source entry: 2.11.1 comes from PyPI.
[tool.uv]
# The two machines this runs on: the Apple-Silicon Mac and the Linux pod.
# (Intel macOS cannot satisfy torch 2.11+ + demucs and is not a target.)
# Supply-chain guard: never lock a release younger than this date. Bump it
# deliberately (then `uv lock --upgrade`), never to chase a same-day release.
exclude-newer = "2026-11-05T00:00:00Z"
# Per-package exception, deliberate: av 18.1.0 was yanked (double free when
# decoding audio with custom channel layouts) and its fix, 18.1.1, was uploaded
# 2026-11-21. Drop this when the global date passes it.
exclude-newer-package = { av = "2026-11-22T00:00:00Z" }
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# faster-whisper 1.2.1 calls av.open(..., metadata_errors=...), which PyAV 19
# removed. The lock split av by Python (18.1 on the Mac's 3.11, 19.0 on the
# pod's 3.12), so ASR worked locally and crashed on the pod (2026-11-24).
constraint-dependencies = ["av<19"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
extend-exclude = ["third_party", "venvs", "work"]

[tool.ruff.lint]
# Correctness only. Style is not enforced on a codebase this comment-dense.
select = ["F", "B"]
# B023 (closure over a loop variable): every hit is a closure CALLED inside the
# same iteration (e.g. s5_fit.seg_wav), where late binding cannot bite.
# B008 is FastAPI-style noise we don't have; kept off explicitly.
ignore = ["B023", "B008"]
