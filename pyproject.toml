[project]
name = "dubadabidu"
version = "0.4.0"
description = "Ukrainian -> multilingual AI video dubbing with voice cloning (Qwen3-TTS)"
requires-python = ">=3.10,<3.13"
dependencies = [
  "faster-whisper==1.2.1",
  # torch/torchaudio are pinned 2.11.0 by the pod bootstrap (runpod_infra
  # REMOTE_SETUP), which installs them from the cu128 index BEFORE this
  # project, so nothing here may pin them. They used to arrive via the `clone`
  # extra (chatterbox-tts), which was removed with chatterbox on 2026-08-02.
  # 2.11.0 is the torchaudio ceiling; the CUDA 12.4 driver that once forced
  # 2.6.0 is filtered out by runpod.allowed_cuda_versions. Locally, install
  # torch on the same command line as .[sep] — audio-separator declares
  # torch>=2.3 with no upper bound and will happily pull 2.13.
  "edge-tts==7.2.8",
  "srt==3.5.3",
  "soundfile==0.14.0",
  "librosa==0.11.0",
  "pydub==0.25.1",
  "openai==2.45.0",
  "jiwer",
  "num2words",            # digit->word expansion in backcheck WER normalization
  "speechbrain==1.1.0",   # ECAPA-TDNN speaker similarity (qc), Apache-2.0
  "distillmos==0.9.1",    # neural MOS naturalness proxy (qc), MIT
  "pyyaml",
]

[project.optional-dependencies]
# RoFormer separation backend (s1, local-only: the remote flow runs s1/s2 on the
# Mac, so pods install plain .[dev]). [cpu] only picks the onnxruntime flavor —
# RoFormer ckpts run on torch and auto-use CUDA/MPS either way.
# CAUTION, still live: audio-separator declares only `torch>=2.3` with NO upper
# bound, so an unpinned install pulls torch 2.13 and breaks the torchaudio
# pairing (torchaudio stopped at 2.11). Always install with torch/torchaudio
# pinned ON THE SAME COMMAND LINE:
#   uv pip install 'audio-separator[cpu]==0.44.5' torch==2.11.0 torchaudio==2.11.0
# 0.30.2 was the numpy<2 ceiling forced by chatterbox; chatterbox went on
# 2026-08-02 and 0.44.5 requires numpy>=2, so the two moved together.
# Our pinned checkpoint (separation.roformer_model,
# model_bs_roformer_ep_317_sdr_12.9755) is still in 0.44.5's registry — the
# library moved, the model did not, so stems stay comparable.
# WART: 0.44.5 hard-depends on onnx-weekly, a dev-channel build. Upstream's
# choice, not pinnable from here; it is why this stays an OPT-IN extra.
#
# demucs lives HERE, not in core, since 2026-08-03. It is the FALLBACK
# separation backend (separation.backend: demucs) and separation is s1 — a
# stage that runs on the Mac and never on a pod, because the pod is deliberately
# never sent the source video. Every pod bootstrap was nonetheless resolving and
# downloading demucs and its tree (dora-search, julius, lameenc, openunmix) for
# code it cannot reach. `pip install -e '.[dev]'` is on the critical path of
# every fresh pod, so this is pure billed wall clock.
sep = ["audio-separator[cpu]==0.44.5", "demucs==4.1.0"]
# Apple-Silicon-only ASR accel: Whisper via MLX (Metal/ANE), ~4-5x vs CPU int8.
# mlx is macOS/arm64-only — keep it OUT of core requirements (it won't resolve on
# the Linux CUDA box, which auto-uses faster-whisper anyway).
mac = ["mlx-whisper"]
# s6 mastering chain (mix.master.enabled). pedalboard is GPLv3 — kept opt-in so
# the default install stays permissive; it only processes audio, so the mixed
# WAV output is not a derivative and course output stays unencumbered.
master = ["pedalboard"]
dev = ["pytest"]

[project.scripts]
dubadabidu = "dub:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dub"]
packages = ["pipeline", "qc"]
