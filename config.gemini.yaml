# Translation-provider overlay — Google Gemini (use when FINALIZING; WMT25
# human-eval quality winner, best cost-performance for our languages).
# Sets only the translation endpoint; compose with any TTS/GPU config:
#   dubadabidu run video.mp4 --overlay config.gpu.yaml --overlay config.gemini.yaml
# Requires TRANSLATE_API_KEY = your Google AI Studio key (aistudio.google.com).

translation:
  # Gemini's OpenAI-compatible endpoint (works through the same `openai` SDK).
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  model: gemini-2.5-flash           # verify exact id from GET /v1/models
  response_format: json_object
  # Gemini context caching is MANUAL (unlike DeepSeek's automatic) and the
  # OpenAI-compat path may not expose it — but cost is still trivial here
  # (~$12 for the whole 20-video batch), so it is not worth engineering around.

