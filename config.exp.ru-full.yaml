# FULL-COVERAGE bake-off subset. Stack this ON TOP of an experiment overlay:
#
#   dubadabidu remote bakeoff <video> --langs ru --reuse --keep-alive \
#     --overlay config.gpu.yaml --overlay config.exp.ru-stress.yaml \
#     --overlay config.exp.ru-full.yaml
#
# WHY IT EXISTS. bakeoff.subset_size defaults to 6, which is right when the
# effect under test is a mean shift — 6 segments x 3 takes averages away
# take-to-take variance cheaply. It is WRONG when the effect is a per-segment
# failure that either happens or does not.
#
# MEASURED 2026-08-09: the listener marked BOTH versions unusable on 6 of 25
# rated Russian segments — a 24% hard-failure rate, attributed by ear to wrong
# lexical stress. A 6-segment subset samples ~1.4 of those in expectation. Half
# the time it would draw 0 or 1, and "RUAccent fixed the one broken segment we
# happened to sample" is not a result. The known-bad segments (u0006, u0015,
# u0020, u0023, u0027, u0030) must all be IN the test, and the only way to
# guarantee that without a segment-picking API is to take every segment.
#
# COST. 46 segments x 2 takes x 2 arms ~ 184 takes at ~2.4 s/take is ~7 min of
# synthesis plus scoring, ~$0.06 on a pod that is already up. takes drops 3 -> 2
# because coverage is what this experiment needs and takes are what it would
# otherwise spend the budget on: a per-segment failure does not average out, so
# a third take buys much less here than a 40th segment.
#
# subset_size is capped at the number of translated utterances by _subset, so
# a value at or above that count simply means "all of them" and this file does
# not need to track the lesson's length.
bakeoff:
  subset_size: 999      # i.e. every translated segment
  takes: 2
