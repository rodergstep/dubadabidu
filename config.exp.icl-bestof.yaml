# EXPERIMENT: ICL + higher best_of. Stacks the ICL overlay's clone settings
# and raises take count so SELECTION can claw back the liveliness ICL costs.
#
# WHY. Measured 2026-08-03: ICL wins identity decisively (en sim 0.524 -> 0.700,
# 17x the noise band) but drops f0st ~0.9 to 1.98 — BELOW tts.min_f0st (2.2), so
# our own monotony floor would flag every ICL take as too flat. min_f0st is a
# SELECTION lever: it prefers takes clearing the floor but cannot invent them, so
# it only helps if there are enough takes to choose from. best_of is measured
# still improving at k=6 (no plateau), which is the headroom this uses.
#
# MEASURE THE DELIVERED TAKE, NOT THE BAKE-OFF MEAN. The scorecard averages over
# takes, so it cannot show a selection gain by construction — run this through
# s4 and read `evaluate`, which grades the take that actually ships.
#   dubadabidu remote bakeoff <video> --langs en --reuse --keep-alive \
#     --overlay config.gpu.yaml --overlay config.exp.icl.yaml
#
# WHY: sim→real is qwen's weakest metric (0.614; voxcpm managed 0.804 before it
# was cut). x_vector_only extracts a speaker EMBEDDING and nothing else. Passing
# the reference transcript switches on full ICL — ref audio *and* its text in
# context — which upstream documents as measurably better speaker similarity.
#
# WHY IT WAS RULED OUT BEFORE, AND WHY THAT WAS TOO QUICK: Ukrainian is not one
# of Qwen3-TTS's 10 synthesis languages. But the reference transcript only has to
# be TOKENIZED, not synthesized, and Qwen3's tokenizer handles Cyrillic. The real
# risk is accent bleed — UA prosody leaking into the English output — which is
# exactly what x_vector mode is documented to avoid. So this is a genuine A/B
# with a plausible downside, not a free win, and the ear arbitrates: variant_key
# gives it its own "+icl" row so both audio sets survive.
#
# reference_text MUST match reference_wav exactly — a mismatched transcript
# degrades cloning, which would make this test read as "ICL is worse" when it
# only means "we passed the wrong text". These come from work/sketch60/refs.json.
# EDIT BOTH LINES TOGETHER to whichever reference the sweep picked.
tts:
  best_of: 6            # selection headroom (measured: still rising at k=6)
  qwen_x_vector_only: false
  reference_wav: ref/Organising the colour palette and materials_ref_04.wav
  # TRIM MUST BE OFF HERE. refs.json's transcript covers the FULL 15.04 s clip;
  # trimming to 12 s would leave the last ~3 s of text describing audio that is
  # no longer there, and a mismatched transcript degrades cloning — the test
  # would then read as "ICL is worse" when it only means "we passed wrong text".
  reference_max_s: 0
  reference_text: "Я передусім видавлю ультрамарин, який потрібний для холодних партій в натюрморті."

bakeoff:
  tune:
    enabled: false        # fixes the reference: this run tests ONE axis.
                          # NOTE this is what disables the sweep — a
                          # `grids: {qwen: {}}` here would NOT, because
                          # deep_merge merges dicts instead of replacing them,
                          # so the base grid's keys survive an empty override.
