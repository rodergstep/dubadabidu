# Translation-provider overlay — DeepSeek (CURRENT default).
# Sets only the translation endpoint; compose with any TTS/GPU config:
#   dubadabidu run video.mp4 --overlay config.gpu.yaml --overlay config.deepseek.yaml
# Requires TRANSLATE_API_KEY = your DeepSeek key (platform.deepseek.com).

translation:
  base_url: https://api.deepseek.com
  # deepseek-chat / deepseek-reasoner names are DEPRECATED 2026-07-24 — use v4.
  model: deepseek-v4-flash
  response_format: json_object      # v4 supports json_object
  # DeepSeek AUTO-caches the big shared context (glossary + terms + full
  # transcript): ~98% off input on cache hits, so a lesson's context is
  # effectively free after the first batch. ~$2 for the whole 20-video batch.
  # No config needed — caching is automatic and matches our prompt shape
  # (big shared system prompt, small per-batch payload).
