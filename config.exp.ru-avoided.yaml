# EXPERIMENT: does the listener prefer a correctly-stressed SYNONYM to a
# mis-stressed exact word?
#
# translation.avoid_mis_stressed shipped on 2026-08-11 and this trade was never
# measured (FINDINGS 2.1k). Avoidance covers 2-3 of the 9 marked words —
# `цвета` -> `тона`/`оттенки`, `выдавливаю` -> `выжимаю` — and buys correct
# stress at the cost of a word choice nobody asked for. In a still-life course
# that may be a bad bargain, and only the ear can say.
#
# Prepare with:   python -m qc.avoidance_ab <video> ru --apply
# which writes tr.ru.text_variants.avoided WITHOUT touching the shipped text.
#
# CONTROL is config.exp.ru-control.yaml — same stack, no text_variant, so it
# synthesizes the shipped wording. Compare the two by ear on a qc/compare page.
tts:
  variant_label: avoided

bakeoff:
  text_variant: avoided   # THE axis — everything else matches the control
  tune:
    enabled: false
