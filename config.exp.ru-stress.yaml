# EXPERIMENT: RU lexical stress (RUAccent combining acutes) vs unaccented.
#
#   dubadabidu remote bakeoff <video> --langs ru --reuse --keep-alive \
#     --overlay config.gpu.yaml --overlay config.exp.ru-stress.yaml
#
# The CONTROL is config.exp.ru-control.yaml: same overlay stack, no ru_stress,
# and a variant_label so the two rows cannot merge. Run both, diff the
# scorecard, then judge by ear — this axis is about which SYLLABLE is stressed,
# and no metric we have measures that. sim/mos/f0st can only tell us whether the
# marks damaged anything else.
#
# WHY. The listener reported wrong stress on the shipped ru track (2026-08-03),
# and again after the reference change (2026-08-09). Russian stress is lexical,
# unmarked in writing, and homographs resolve only from context (за́мок / замо́к),
# so a TTS must guess. RUAccent marks it explicitly.
#
# WHY IT IS A QUESTION, NOT A FIX. Chatterbox was TRAINED on combining acutes —
# A/B-verified 2026-07-08 that marks fix its stress — and qwen was not. Marks may
# help, do nothing, or be read as noise. The row carries a +stress suffix
# (qc/bakeoff.variant_key) so both audio sets survive for the ear, and ru_stress
# salts synth_hash so the A side cannot serve the B side's cached takes.
#
# THIS NEVER ACTUALLY RAN. The 2026-08-03 attempt died before synthesis:
# ruaccent declares `transformers` unpinned, pip resolved 5.14.1, and
# faster-qwen3-tts needs <5, so the pod came up with `qwen unavailable` and the
# whole A/B measured nothing. Fixed in 41ed3d9 (transformers==4.57.3 declared in
# pyproject) and guarded by tests/test_deps.py. Check the pod log for the
# "qwen ok, torch ... transformers ..." line before believing any result here.
#
# NO REFERENCE PINNED, deliberately — changed 2026-08-09. This file used to pin
# `Organising the colour palette and materials_ref_04.wav` plus a transcript,
# copy-pasted wholesale from the ICL overlay along with two paragraphs of ICL
# prose that had nothing to do with stress. That made the experiment measure
# stress marks ON A REFERENCE WE DO NOT SHIP. tune.enabled: false alone fixes
# the reference (it disables the tune-lite sweep, which would otherwise re-pick
# one from bakeoff.grids); with no override the reference falls through to
# config.gpu.yaml's tts.reference_wav — sketch_ref_08.trim12s, the clip the
# blind ear test chose and the one production actually uses. A result measured
# on the shipped reference is the only one that transfers.
tts:
  ru_stress: true       # THE axis under test — nothing else may differ

bakeoff:
  tune:
    enabled: false        # fixes the reference: this run tests ONE axis.
                          # NOTE this is what disables the sweep — a
                          # `grids: {qwen: {}}` here would NOT, because
                          # deep_merge merges dicts instead of replacing them,
                          # so the base grid's keys survive an empty override.
