# Translation-provider overlay — Google Gemini (use when FINALIZING; WMT25
# human-eval quality winner, best cost-performance for our languages).
# Sets only the translation endpoint; compose with any TTS/GPU config:
#   dubadabidu run video.mp4 --overlay config.gpu.yaml --overlay config.gemini.yaml
# Requires TRANSLATE_API_KEY = your Google AI Studio key (aistudio.google.com).

translation:
  # Gemini's OpenAI-compatible endpoint (works through the same `openai` SDK).
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  # UNVERIFIED: this id has not been checked against the live endpoint or run
  # through the harness. `dubadabidu doctor` lists /models and fails if it is
  # not served — run it before translating anything with this overlay.
  model: gemini-2.5-flash
  response_format: json_object
  # Gemini context caching is MANUAL (unlike DeepSeek's automatic) and the
  # OpenAI-compat path may not expose it — but cost is still trivial here
  # (~$12 for the whole 20-video batch), so it is not worth engineering around.

# --- Stronger critic (wired) ------------------------------------------------
# The 3-pass flow is draft -> reflect(critic) -> adapt (translation.passes: 3).
# translation.reflect_model runs ONLY the reflect pass on a different model
# (translation.adequacy_model likewise for the adequacy check); both fall back
# to `model` when unset. Same endpoint and key, so the critic must be served by
# this base_url, e.g.:
#   translation:
#     reflect_model: <a stronger Gemini id — verify with `doctor`>
