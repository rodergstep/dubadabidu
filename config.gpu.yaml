# RunPod profile — GPU / TTS settings ONLY (translation-provider-agnostic).
# Overlays are stackable, so compose this with a translation-provider overlay:
#   dubadabidu run video.mp4 --overlay config.gpu.yaml --overlay config.deepseek.yaml
# Provider overlays: config.deepseek.yaml (current) | config.gemini.yaml (later).
# (--overlay config.gpu.yaml alone leaves translation at config.yaml's default.)

tts:
  best_of: 5                  # takes are cheap on GPU; the composite ranking
                              # (windowed MOS + f0 + ECAPA sim) picks the best

  # --- engine bake-off candidates (GPU-only git-clone installs; THIRD_PARTY.md) ---
  # CosyVoice: covers all 5 targets + cross-lingual. cross_lingual mode needs NO
  # ref transcript — the path for a Ukrainian reference. instruct mode adds
  # per-segment emotion via a natural-language instruct_text (no custom code).
  cosyvoice_model_dir: pretrained_models/CosyVoice2-0.5B
  cosyvoice_mode: cross_lingual        # cross_lingual | zero_shot | instruct | auto
  # IndexTTS-2: EN + Mandarin ONLY (guarded). Disentangled emotion — with
  # emotion_from_source: true, s4/s5 cut each utterance's own slice of the
  # source vocals as its emotion prompt (real per-segment prosody transfer);
  # a manual emotion_wav is a global override. indextts_duration_ratio
  # (0.75-1.25) is native pace control.
  indextts_model_dir: checkpoints
  emotion_from_source: true   # cut each utterance's own source slice as the
                              # emotion prompt (per-segment prosody transfer).
                              # No-op unless a lang is routed to indextts below.
  # emo_alpha: 1.0            # scales the transferred emotion (default 1.0)
  # indextts_duration_ratio: 1.0
  # VoxCPM2: 2B, 30 languages auto-detected (all 5 targets; NOT uk — clones
  # from ref audio alone, transcript-free), 48 kHz out, ~8 GB VRAM, top-tier
  # published SIM scores. pip install — but WITH pins (THIRD_PARTY.md).
  voxcpm_model_dir: openbmb/VoxCPM2    # HF id (auto-download) or local dir
  # voxcpm_cfg_value: 2.0
  # voxcpm_timesteps: 10
  # Qwen3-TTS Base: 10 languages (all 5 targets), 3 s clone, ~4 GB VRAM,
  # Apache-2.0. UA ref -> x_vector_only (speaker embedding only, no ref
  # transcript). git-clone install (THIRD_PARTY.md).
  qwen_model_dir: Qwen/Qwen3-TTS-12Hz-1.7B-Base   # or -0.6B-Base (lighter)
  qwen_x_vector_only: true             # UA ref: clone from audio embedding only
  # qwen_flash_attn: true              # enable only if flash-attn is installed

  # After the bake-off, pin the winning engine per language, e.g.:
  # engine_by_lang: {en: indextts, fr: cosyvoice, de: cosyvoice, es: cosyvoice, ru: chatterbox}
  #
  # emotion_from_source ACTIVATION (one manual step — kept off by default because
  # indextts is a git-clone engine and NOT yet validated/pinned; enabling it
  # blind would break `remote run` at s4). To turn on per-segment prosody
  # transfer for English:
  #   1. validate + pin the indextts commit and fill runpod.engine_setup.indextts
  #      below (incl. the checkpoint download) — see THIRD_PARTY.md
  #   2. uncomment the line below. The pod now auto-installs indextts for a run
  #      (not just bakeoff) and emotion_from_source (above) activates for en.
  # engine_by_lang: {en: indextts}

bakeoff:                       # `dubadabidu bakeoff <video> --langs en`
  engines: [chatterbox, cosyvoice, voxcpm, qwen, indextts]  # indextts self-skips
                               # on non-en/zh langs (adapter raises -> "unavailable")
  subset_size: 6               # stratified by source length
  takes: 3                     # averaged per segment to beat TTS variance
  # tune-lite: every engine sweeps its own grid BEFORE the head-to-head and
  # enters at its own best point. Without this the incumbent arrived tuned
  # (cfg_weight/exaggeration from a real tune run) and challengers arrived at
  # library defaults — the comparison could not be lost, and "keep incumbent"
  # would have looked like evidence. IMPROVEMENT_PLAN Phase C asked for exactly
  # this ("tune-lite ... on BOTH engines").
  tune:
    enabled: true
    subset_size: 3             # SEPARATE from the comparison subset, and smaller:
    takes: 2                   # cost is points x segments x takes, so it grows
                               # fastest here. 2 takes beats a single coin-flip
                               # roll without paying for a full average.
  # Per-engine grids. A config grid REPLACES that engine's built-in default —
  # this is how you widen a sweep or close one. Defaults live in
  # qc/bakeoff.py ENGINE_GRIDS; only knobs that reach manifest.synth_hash are
  # valid (otherwise the cache serves one point's audio for another) and all of
  # them must be Ukrainian-reference safe. An empty/single-point grid means
  # "already tuned, nothing to sweep" and costs nothing.
  # grids:
  #   chatterbox: {exaggeration: [0.4, 0.55, 0.7]}   # re-open the incumbent
  #   voxcpm: {voxcpm_cfg_value: [1.5, 2.0, 2.5], voxcpm_timesteps: [10, 20]}

runpod:                        # M2 infra agent — `dubadabidu remote <task> <video>`
  # Cheapest adequate community GPUs (>=16GB), tried in order (checked 2026-07:
  # A5000 $0.16/hr, 3090 $0.22/hr). Chatterbox ~7GB + whisper ~5GB load
  # sequentially, so 16-24GB is ample.
  gpu_type_ids: ["NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090",
                 "NVIDIA RTX A4500", "NVIDIA RTX A4000"]
  image: runpod/pytorch:2.2.0-py3.10-cuda12.1.1-devel-ubuntu22.04
  interruptible: true          # spot; cheapest, resumable + cached
  budget_usd: 10.0             # HARD cap -> auto-terminate; override with --budget
  assumed_price_per_hr: 0.25   # deadline = budget / this (conservative)
  max_runtime_hours: 3.0       # absolute ceiling regardless of budget
  ssh_key: ~/.ssh/id_ed25519_runpod
  # OPTIONAL and NOT recommended by default: a RunPod network-volume id to
  # persist .venv/venvs across runs, so the per-venv torch install happens once.
  # Do the math before enabling — it does NOT clearly save money:
  #   - a run is capped at min(budget/assumed_price_per_hr, max_runtime_hours)
  #     = 3 h, i.e. well under $1 TOTAL. The install it avoids is ~$0.17 of that.
  #   - volume storage bills CONTINUOUSLY, including months with no runs, so
  #     break-even needs roughly 20 runs inside one month. A 20-video batch only
  #     reaches that if it is compressed into a single month.
  #   - a network volume is REGION-LOCKED, so it pins the pod to one datacenter
  #     and shrinks the spot pool that interruptible: true + four gpu_type_ids
  #     are there to exploit. Expect more provisioning failures / waits.
  # Enable it for WALL-CLOCK and install-flakiness reasons if you end up
  # iterating heavily in a short window — not as a cost measure.
  # network_volume_id: ""
  # Per-engine install snippets for `remote bakeoff` (chatterbox is always
  # installed by REMOTE_SETUP into the MAIN .venv). Each snippet runs on the
  # pod inside that engine's OWN venv — venvs/<engine>, created and activated
  # by engine_install_cmd before the snippet — so its resolver may pick
  # whatever torch/numpy it wants: the chatterbox baseline is untouchable BY
  # CONSTRUCTION (this per-engine isolation replaced the old best-effort
  # torch-pin guard tails). s4/bakeoff automatically route an engine through
  # a worker subprocess in its venv whenever venvs/<engine> exists
  # (pipeline/engine_client.py); the snippet MUST leave the engine importable
  # in ITS venv with no PYTHONPATH — pip install -e the clone, or drop a .pth
  # into site-packages. An empty/failing snippet => that engine is marked
  # unavailable and skipped, so a partial bake-off still runs.
  #
  # STATUS: filled best-effort from THIRD_PARTY.md, but UNPINNED (clones default
  # branch) and NOT yet run on a pod. VALIDATE CHEAPLY FIRST with
  # `dubadabidu remote setup-check` (~$0.30) — it runs these snippets on one pod
  # and probes each engine INSIDE its venv, so you don't debug installs on a
  # billing bake-off. Before trusting a comparison, confirm:
  #   (a) the checkpoint repo id `IndexTeam/IndexTTS-2` (IndexTTS-2 weights);
  #   (b) each repo's HEAD still matches the API in pipeline/tts_engine.py.
  # Clones are guarded with `[ -d ... ] ||` so a persistent-volume re-run
  # (runpod.network_volume_id) doesn't fail on an existing checkout.
  # PINNING: each clone-based snippet has a `# pin:` line showing the exact edit —
  # append `&& git -C third_party/<repo> checkout <SHA>` right after its clone once
  # a run validates the commit (THIRD_PARTY.md "Pinned commit" lines).
  engine_setup:
    # CosyVoice: no pip package -> weights via modelscope + a .pth putting the
    # repo AND its Matcha-TTS submodule on the ENGINE venv's sys.path.
    # pin: append `&& git -C third_party/CosyVoice checkout <SHA>` after the clone.
    cosyvoice: "{ [ -d third_party/CosyVoice ] || git clone --recursive https://github.com/FunAudioLLM/CosyVoice third_party/CosyVoice; } && pip install -q -r third_party/CosyVoice/requirements.txt && pip install -q modelscope && python -c 'from modelscope import snapshot_download as d; d(\"iic/CosyVoice2-0.5B\", local_dir=\"pretrained_models/CosyVoice2-0.5B\")' && python -c 'import sysconfig,os;p=sysconfig.get_paths()[\"purelib\"];r=os.getcwd();open(os.path.join(p,\"cosyvoice.pth\"),\"w\").write(r+\"/third_party/CosyVoice\\n\"+r+\"/third_party/CosyVoice/third_party/Matcha-TTS\\n\")'"
    # VoxCPM2: plain pip. In its own venv the resolver is free to pick its
    # preferred torch/torchcodec (the old same-line pins defended the shared
    # venv's torch 2.6.0 — no longer needed). Weights auto-download at load.
    voxcpm: "pip install -q voxcpm==2.0.3"
    # Qwen3-TTS: editable install makes `qwen_tts` importable; weights (HF id in
    # tts.qwen_model_dir) auto-download at load.
    # pin: append `&& git -C third_party/Qwen3-TTS checkout <SHA>` after the clone.
    qwen: "{ [ -d third_party/Qwen3-TTS ] || git clone https://github.com/QwenLM/Qwen3-TTS third_party/Qwen3-TTS; } && pip install -q -e third_party/Qwen3-TTS"
    # IndexTTS-2 (en/zh; also powers emotion_from_source for en). Editable install
    # makes `indextts` importable; checkpoints -> ./checkpoints (indextts_model_dir).
    # pin: append `&& git -C third_party/index-tts checkout <SHA>` after the clone.
    indextts: "{ [ -d third_party/index-tts ] || git clone https://github.com/index-tts/index-tts third_party/index-tts; } && pip install -q -e third_party/index-tts && pip install -q -U \"huggingface_hub[cli]\" && huggingface-cli download IndexTeam/IndexTTS-2 --local-dir checkpoints"
  # SAFETY: pod id persisted to work/.runpod_active.json on create; terminate
  # retries+verifies and only clears state on confirmation; an independent
  # pod-side watchdog self-destructs at the deadline even if this process dies;
  # `remote kill`/next call sweeps orphans. .env (RunPod key) never reaches pod.
