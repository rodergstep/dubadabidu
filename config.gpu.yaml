# RunPod profile — GPU / TTS settings ONLY (translation-provider-agnostic).
# Overlays are stackable, so compose this with a translation-provider overlay:
#   dubadabidu run video.mp4 --overlay config.gpu.yaml --overlay config.deepseek.yaml
# Provider overlays: config.deepseek.yaml (current) | config.gemini.yaml (later).
# (--overlay config.gpu.yaml alone leaves translation at config.yaml's default.)

tts:
  best_of: 5                  # takes are cheap on GPU; the composite ranking
                              # (windowed MOS + f0 + ECAPA sim) picks the best

  # --- engine bake-off candidates (GPU-only git-clone installs; THIRD_PARTY.md) ---
  # CosyVoice: covers all 5 targets + cross-lingual. cross_lingual mode needs NO
  # ref transcript — the path for a Ukrainian reference. instruct mode adds
  # per-segment emotion via a natural-language instruct_text (no custom code).
  cosyvoice_model_dir: pretrained_models/CosyVoice2-0.5B
  cosyvoice_mode: cross_lingual        # cross_lingual | zero_shot | instruct | auto
  # IndexTTS-2: EN + Mandarin ONLY (guarded). Disentangled emotion — with
  # emotion_from_source: true, s4/s5 cut each utterance's own slice of the
  # source vocals as its emotion prompt (real per-segment prosody transfer);
  # a manual emotion_wav is a global override. indextts_duration_ratio
  # (0.75-1.25) is native pace control.
  indextts_model_dir: checkpoints
  emotion_from_source: true   # cut each utterance's own source slice as the
                              # emotion prompt (per-segment prosody transfer).
                              # No-op unless a lang is routed to indextts below.
  # emo_alpha: 1.0            # scales the transferred emotion (default 1.0)
  # indextts_duration_ratio: 1.0
  # VoxCPM2: 2B, 30 languages auto-detected (all 5 targets; NOT uk — clones
  # from ref audio alone, transcript-free), 48 kHz out, ~8 GB VRAM, top-tier
  # published SIM scores. pip install — but WITH pins (THIRD_PARTY.md).
  voxcpm_model_dir: openbmb/VoxCPM2    # HF id (auto-download) or local dir
  # Validated on the first successful GPU bake-off (sketch60/en, 2026-07-30) and
  # confirmed BY EAR — the user picked u0002 out of the listening page, which was
  # synthesized at exactly these settings. Measured there: sim→real 0.804,
  # wer 0.018 (essentially perfect intelligibility), f0st 2.21, s/take 2.9 s.
  # cfg 2.5 came from tune-lite; treat the margin over the 2.0 default as
  # unproven (see bakeoff.tune.takes) but the ear preference as real.
  voxcpm_cfg_value: 2.5
  voxcpm_timesteps: 10                 # the 20 setting is noise; costs time only
  # Qwen3-TTS Base: 10 languages (all 5 targets), 3 s clone, ~4 GB VRAM,
  # Apache-2.0. UA ref -> x_vector_only (speaker embedding only, no ref
  # transcript). git-clone install (THIRD_PARTY.md).
  qwen_model_dir: Qwen/Qwen3-TTS-12Hz-1.7B-Base   # or -0.6B-Base (lighter)
  qwen_x_vector_only: true             # UA ref: clone from audio embedding only
  # qwen_flash_attn: true              # enable only if flash-attn is installed

  # After the bake-off, pin the winning engine per language, e.g.:
  # engine_by_lang: {en: indextts, fr: cosyvoice, de: cosyvoice, es: cosyvoice, ru: chatterbox}
  #
  # emotion_from_source ACTIVATION (one manual step — kept off by default because
  # indextts is a git-clone engine and NOT yet validated/pinned; enabling it
  # blind would break `remote run` at s4). To turn on per-segment prosody
  # transfer for English:
  #   1. validate + pin the indextts commit and fill runpod.engine_setup.indextts
  #      below (incl. the checkpoint download) — see THIRD_PARTY.md
  #   2. uncomment the line below. The pod now auto-installs indextts for a run
  #      (not just bakeoff) and emotion_from_source (above) activates for en.
  # engine_by_lang: {en: indextts}

bakeoff:                       # `dubadabidu bakeoff <video> --langs en`
  # chatterbox REMOVED 2026-07-30 at the user's call — its quality is already
  # known by ear from the local sketch60 runs, and installing it on the pod costs
  # ~5 GB of CUDA torch for a row we don't need. CONSEQUENCE: it is the incumbent,
  # so beats_incumbent() has no baseline and every challenger reports "no
  # incumbent baseline" — the adoption gate becomes ADVISORY and the decision
  # moves to the ear on the .html page plus the raw sim→real / mos numbers.
  # Put chatterbox back at the front of this list to restore the gate.
  # ONE ENGINE AT A TIME (2026-07-30). Installing all four before testing any of
  # them meant every download was paid for before a single result existed — and a
  # late failure threw the lot away, which is what happened repeatedly. Testing
  # one engine per run needs no code change (remote_run installs exactly what is
  # listed here) and gives: disk peak of one venv instead of four, first result in
  # minutes, and a failure that costs only its own engine.
  # Work through them by editing this list: voxcpm (proven installer) -> cosyvoice
  # -> qwen -> indextts. Put several back once each recipe is validated.
  engines: [cosyvoice]           # now installable; get its scorecard row
                               # on non-en/zh langs (adapter raises -> "unavailable")
  subset_size: 6               # stratified by source length
  takes: 3                     # averaged per segment to beat TTS variance
  # tune-lite: every engine sweeps its own grid BEFORE the head-to-head and
  # enters at its own best point. Without this the incumbent arrived tuned
  # (cfg_weight/exaggeration from a real tune run) and challengers arrived at
  # library defaults — the comparison could not be lost, and "keep incumbent"
  # would have looked like evidence. IMPROVEMENT_PLAN Phase C asked for exactly
  # this ("tune-lite ... on BOTH engines").
  tune:
    enabled: true
    subset_size: 3             # SEPARATE from the comparison subset, and smaller:
    takes: 4                   # cost is points x segments x takes, so it grows
                               # fastest here. Raised 2 -> 4 on 2026-07-30: at 2
                               # takes the sweep could not resolve its own winner.
                               # It picked voxcpm cfg=2.5 on mos 2.515, and the
                               # larger comparison sample measured 2.382 at that
                               # same config — level with the cfg=2.0 default's
                               # 2.389. Take-to-take mos± was 0.374 against a grid
                               # spread of 0.46, i.e. the ranking was noise.
                               # Budget is unchanged: voxcpm's grid dropped from
                               # 6 points (3 cfg x 2 timesteps) to 3, and the
                               # timesteps axis was the half proven to be noise.
  # Per-engine grids. A config grid REPLACES that engine's built-in default —
  # this is how you widen a sweep or close one. Defaults live in
  # qc/bakeoff.py ENGINE_GRIDS; only knobs that reach manifest.synth_hash are
  # valid (otherwise the cache serves one point's audio for another) and all of
  # them must be Ukrainian-reference safe. An empty/single-point grid means
  # "already tuned, nothing to sweep" and costs nothing.
  # grids:
  #   chatterbox: {exaggeration: [0.4, 0.55, 0.7]}   # re-open the incumbent
  #   voxcpm: {voxcpm_cfg_value: [1.5, 2.0, 2.5], voxcpm_timesteps: [10, 20]}

runpod:                        # M2 infra agent — `dubadabidu remote <task> <video>`
  # SECURE cloud (2026-07-30): COMMUNITY had no on-demand capacity at all for
  # these types ("create pod: There are no instances currently available") and
  # its spot pods were reclaimed within 1-9 min, four times running. Secure is
  # RunPod's own datacenters, where on-demand capacity actually exists. Costs
  # roughly 2-3x community per hour; max_runtime_hours still caps a run at 3 h.
  cloud_type: SECURE
  # Widened for availability, and deliberately capped at the mid tier: create_pod
  # sends gpuTypePriority=availability, so RunPod picks whichever is FREE, not
  # whichever is cheapest — listing an A6000/L40S/H100 class card here would risk
  # landing on one. Everything below is >=16GB (chatterbox ~7GB + whisper ~5GB
  # load sequentially; voxcpm wants ~8GB), which is all the pipeline needs.
  # An unrecognised id fails the create call instantly with an API 400 and costs
  # nothing. USEFUL TRICK: that 400 body lists the ENTIRE valid enum, which is the
  # only way to get it — rest.runpod.io/v1 has no /gpuTypes endpoint. Send a
  # deliberate bad id to refresh this list. ("NVIDIA A30" is NOT a valid id.)
  # All entries below are >=16GB and mid-tier; H100/B200/A100/RTX-6000 class are
  # omitted on purpose so gpuTypePriority=availability cannot land on one.
  gpu_type_ids: ["NVIDIA RTX A5000", "NVIDIA GeForce RTX 3090",
                 "NVIDIA GeForce RTX 3090 Ti",
                 "NVIDIA RTX A4500", "NVIDIA RTX A4000",
                 "NVIDIA L4",
                 "NVIDIA RTX 4000 Ada Generation",
                 "NVIDIA RTX 2000 Ada Generation",
                 "NVIDIA GeForce RTX 4080", "NVIDIA GeForce RTX 4080 SUPER",
                 "NVIDIA GeForce RTX 4090"]
  image: runpod/pytorch:2.2.0-py3.10-cuda12.1.1-devel-ubuntu22.04
  # 150 GB, up from the 30 GB default. THIS was the real cause of the bootstrap
  # failures on 2026-07-30: per-engine venv isolation multiplies torch by the
  # number of challengers, and nobody sized the disk for it. Measured/estimated:
  #   devel CUDA base image ~20 GB, main .venv ~5 GB, and ~7-10 GB per challenger
  #   venv (its own CUDA torch + model weights) -> ~60 GB for four, before
  #   headroom for pip's build dirs and HF cache.
  # At 30 GB the container ran out of space and was killed, which presented as
  # `closed by remote host` on the next SSH connection (sshd dies with it) and as
  # "connection interrupted" mid-wheel-download. Both looked like network or spot
  # problems and were misdiagnosed three times before `No space left on device`
  # surfaced from a synth call. Container disk is billed only while the pod runs,
  # so this is nearly free; a too-small value costs an entire run.
  # SIZE THIS TO len(bakeoff.engines) — container disk is billed per GB while the
  # pod runs, so 150 GB for a one-engine run is money for nothing. Peak usage:
  #   devel CUDA base image      ~20 GB   (fixed)
  #   main .venv (torch 2.6)      ~5 GB   (fixed — qc metrics need it)
  #   ONE engine venv            ~7-15 GB (own CUDA torch + model weights)
  #   pip build dirs + HF cache   ~5 GB   (transient)
  #   project + work/             ~1 GB
  #   -> ~36-46 GB peak for a single engine; 60 GB is comfortable headroom.
  # Testing engines ONE AT A TIME (see bakeoff.engines) is what makes this safe.
  # Raise it back toward 150 if you ever list several engines in one run again —
  # per-engine venv isolation multiplies torch by the number of challengers, and
  # under-sizing it is what broke seven runs on 2026-07-30 (see the note above).
  container_disk_gb: 60
  # ON-DEMAND (2026-07-30). Four consecutive spot pods died mid-bootstrap with
  # `closed by remote host` at lifetimes of 62s / 7m27s / 8m32s / 8m53s — three of
  # them on the SAME host 213.144.200.240. Variable lifetimes rule out a
  # deterministic step in our setup (apt was investigated and cleared: attempt 4
  # ran `0 upgraded, 2 newly installed` and still died), and repeatedly landing on
  # one host points at reclamation / an unhealthy box. On-demand removes that
  # variable. Cost is irrelevant here: max_runtime_hours caps a run at 3 h, so
  # worst case moves from ~$0.75 to ~$1.50.
  # Flip back to true once a run completes end-to-end — spot is genuinely fine
  # for the batch, where the manifest cache makes a preempted run resumable.
  interruptible: false         # on-demand; diagnostic (see above)
  budget_usd: 10.0             # HARD cap -> auto-terminate; override with --budget
  assumed_price_per_hr: 0.60   # SECURE mid-tier, was 0.25 for community spot.
                               # deadline = min(budget/this, max_runtime_hours);
                               # at 3 h that is ~$1.80, still far under budget_usd.
                               # Kept honest so a LOWER budget_usd would actually
                               # shorten the deadline instead of silently not.
  max_runtime_hours: 3.0       # absolute ceiling regardless of budget
  ssh_key: ~/.ssh/id_ed25519_runpod
  # OPTIONAL and NOT recommended by default: a RunPod network-volume id to
  # persist .venv/venvs across runs, so the per-venv torch install happens once.
  # Do the math before enabling — it does NOT clearly save money:
  #   - a run is capped at min(budget/assumed_price_per_hr, max_runtime_hours)
  #     = 3 h, i.e. well under $1 TOTAL. The install it avoids is ~$0.17 of that.
  #   - volume storage bills CONTINUOUSLY, including months with no runs, so
  #     break-even needs roughly 20 runs inside one month. A 20-video batch only
  #     reaches that if it is compressed into a single month.
  #   - a network volume is REGION-LOCKED, so it pins the pod to one datacenter
  #     and shrinks the spot pool that interruptible: true + four gpu_type_ids
  #     are there to exploit. Expect more provisioning failures / waits.
  # Enable it for WALL-CLOCK and install-flakiness reasons if you end up
  # iterating heavily in a short window — not as a cost measure.
  # network_volume_id: ""
  # Per-engine install snippets for `remote bakeoff` (chatterbox is always
  # installed by REMOTE_SETUP into the MAIN .venv). Each snippet runs on the
  # pod inside that engine's OWN venv — venvs/<engine>, created and activated
  # by engine_install_cmd before the snippet — so its resolver may pick
  # whatever torch/numpy it wants: the chatterbox baseline is untouchable BY
  # CONSTRUCTION (this per-engine isolation replaced the old best-effort
  # torch-pin guard tails). s4/bakeoff automatically route an engine through
  # a worker subprocess in its venv whenever venvs/<engine> exists
  # (pipeline/engine_client.py); the snippet MUST leave the engine importable
  # in ITS venv with no PYTHONPATH — pip install -e the clone, or drop a .pth
  # into site-packages. An empty/failing snippet => that engine is marked
  # unavailable and skipped, so a partial bake-off still runs.
  #
  # STATUS: filled best-effort from THIRD_PARTY.md, but UNPINNED (clones default
  # branch) and NOT yet run on a pod. VALIDATE CHEAPLY FIRST with
  # `dubadabidu remote setup-check` (~$0.30) — it runs these snippets on one pod
  # and probes each engine INSIDE its venv, so you don't debug installs on a
  # billing bake-off. Before trusting a comparison, confirm:
  #   (a) the checkpoint repo id `IndexTeam/IndexTTS-2` (IndexTTS-2 weights);
  #   (b) each repo's HEAD still matches the API in pipeline/tts_engine.py.
  # Clones are guarded with `[ -d ... ] ||` so a persistent-volume re-run
  # (runpod.network_volume_id) doesn't fail on an existing checkout.
  # PINNING: each clone-based snippet has a `# pin:` line showing the exact edit —
  # append `&& git -C third_party/<repo> checkout <SHA>` right after its clone once
  # a run validates the commit (THIRD_PARTY.md "Pinned commit" lines).
  engine_setup:
    # CosyVoice: no pip package -> weights via modelscope + a .pth putting the
    # repo AND its Matcha-TTS submodule on the ENGINE venv's sys.path.
    # pin: append `&& git -C third_party/CosyVoice checkout <SHA>` after the clone.
    # VALIDATED on a pod 2026-07-30 after six attempts. The crux: steps 2 and 3
    # need OPPOSITE build-isolation settings, which is why every single-flag
    # attempt failed.
    #   WITH isolation, openai-whisper's setup.py cannot find pkg_resources
    #     (modern setuptools dropped it) -> ModuleNotFoundError.
    #   WITHOUT isolation, tensorrt-cu12's wheel_stub PEP 517 backend is missing
    #     (it only exists inside the isolation overlay) -> BackendUnavailable.
    # So: filtered requirements WITH isolation, then openai-whisper ALONE without.
    # The filter drops tensorrt (TensorRT inference), deepspeed (training),
    # gradio/fastapi/uvicorn/grpcio (serving), tensorboard/gdown, and both custom
    # --extra-index-url lines; onnxruntime-gpu -> onnxruntime so the Azure feed is
    # not needed. openai-whisper is NOT optional despite being absent from the
    # inference story: cosyvoice imports `whisper` at module load.
    # The .pth is what makes the CLONE importable (it is not a pip package);
    # engine_client spawns a fresh worker, so an exported PYTHONPATH would not reach it.
    cosyvoice: "{ [ -d third_party/CosyVoice ] || git clone --recursive https://github.com/FunAudioLLM/CosyVoice third_party/CosyVoice; } && grep -vE '^[[:space:]]*(--extra-index-url|deepspeed|tensorrt-cu12|onnxruntime-gpu|gradio|fastapi|fastapi-cli|uvicorn|grpcio|grpcio-tools|tensorboard|gdown|openai-whisper)' third_party/CosyVoice/requirements.txt | grep -vE '^[[:space:]]*(#|$)' > /tmp/cv-req.txt && echo onnxruntime==1.18.0 >> /tmp/cv-req.txt && pip install -q -r /tmp/cv-req.txt && pip install -q --no-build-isolation openai-whisper==20231117 && pip install -q modelscope && python -c 'from modelscope import snapshot_download as d; d(\"iic/CosyVoice2-0.5B\", local_dir=\"pretrained_models/CosyVoice2-0.5B\")' && python -c 'import sysconfig,os;p=sysconfig.get_paths()[\"purelib\"];r=os.getcwd();open(os.path.join(p,\"cosyvoice.pth\"),\"w\").write(r+\"/third_party/CosyVoice\\n\"+r+\"/third_party/CosyVoice/third_party/Matcha-TTS\\n\")' && python -c 'from cosyvoice.cli.cosyvoice import CosyVoice2'"
    # VoxCPM2: plain pip. In its own venv the resolver is free to pick its
    # preferred torch/torchcodec (the old same-line pins defended the shared
    # venv's torch 2.6.0 — no longer needed). Weights auto-download at load.
    voxcpm: "pip install -q voxcpm==2.0.3"
    # Qwen3-TTS: editable install makes `qwen_tts` importable; weights (HF id in
    # tts.qwen_model_dir) auto-download at load.
    # pin: append `&& git -C third_party/Qwen3-TTS checkout <SHA>` after the clone.
    # Qwen3-TTS declares no install_requires, so `pip install -e .` alone
    # completed in 62 s having pulled NOTHING — exit 0, then `import qwen_tts`
    # would fail at synthesis. Install its requirements.txt when the repo ships
    # one, else fall back to the minimum the adapter needs (torch/torchaudio/
    # transformers). flash-attn stays opt-in (tts.qwen_flash_attn).
    qwen: "{ [ -d third_party/Qwen3-TTS ] || git clone https://github.com/QwenLM/Qwen3-TTS third_party/Qwen3-TTS; } && { [ -f third_party/Qwen3-TTS/requirements.txt ] && pip install -q -r third_party/Qwen3-TTS/requirements.txt || pip install -q torch torchaudio transformers; } && pip install -q -e third_party/Qwen3-TTS && python -c 'import qwen_tts'"
    # IndexTTS-2 (en/zh; also powers emotion_from_source for en). Editable install
    # makes `indextts` importable; checkpoints -> ./checkpoints (indextts_model_dir).
    # pin: append `&& git -C third_party/index-tts checkout <SHA>` after the clone.
    # huggingface_hub[cli] + huggingface-cli BOTH broke 2026-07-30: hf-hub 1.25.1 dropped the 'cli' extra, `huggingface-cli` is deprecated and "no longer works" (replaced by `hf`), and force-upgrading hf-hub to 1.25.1 broke transformers 4.52 and tokenizers 0.21, which both need huggingface-hub<1.0. Use the stable PYTHON api instead: no extra, no CLI name churn, no upgrade — transformers already pulls a compatible hf-hub.
    indextts: "{ [ -d third_party/index-tts ] || git clone https://github.com/index-tts/index-tts third_party/index-tts; } && pip install -q -e third_party/index-tts && python -c 'from huggingface_hub import snapshot_download; snapshot_download(\"IndexTeam/IndexTTS-2\", local_dir=\"checkpoints\")' && python -c 'import indextts'"
  # SAFETY: pod id persisted to work/.runpod_active.json on create; terminate
  # retries+verifies and only clears state on confirmation; an independent
  # pod-side watchdog self-destructs at the deadline even if this process dies;
  # `remote kill`/next call sweeps orphans. .env (RunPod key) never reaches pod.
