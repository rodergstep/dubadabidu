# EXPERIMENT: does a lower sampling temperature buy consistency?
#
# WHY THIS IS THE MOST PROMISING UNTESTED KNOB. The control run proved that
# run-to-run variance, not configuration, dominates what the ear hears — two
# IDENTICAL configs were ranked apart. Take-to-take mos± is 0.24-0.49 and the
# best_of curve was still climbing at k=6, which all says the same thing: we are
# paying for variance, in takes and in dice.
#
# Temperature is the direct control. Qwen ships 0.9 (identical across all five
# checkpoints, used in every official benchmark). Lower trades the occasional
# brilliant roll for a tighter distribution — which is a WIN here if it shrinks
# mos± more than it lowers the mean, because best_of exists to paper over spread.
#
# Read mos± on this row, not mos: the question is the SPREAD.
tts:
  variant_label: temp07
  qwen_gen_kwargs:
    temperature: 0.7

bakeoff:
  takes: 6          # need enough takes for mos± to mean anything
  tune:
    enabled: false
