# Acceptance spec — the autopilot's contract (AUTOPILOT.md).
# The agent must make every video/language row satisfy `accept` within
# `budget`, or stop and escalate with reasons. Improve the system by editing
# THIS file, not the pipeline. Only a human edits this file.

accept:
  # 0.60 -> 0.43 on 2026-08-11, WITH THE METRIC, not as a loosening.
  # composite_score switched from whole-take MOS to the worst-3s window
  # (qc.metrics.composite_score) because the old objective was ANTI-correlated
  # with the listener's accept/reject calls (-0.205; the new one is +0.364).
  # The window is systematically lower, so the same audio that used to mean
  # 0.653 now means 0.486 and every video/language would have failed 0.60
  # forever — the autopilot would ESCALATE everything, on a bar that had
  # quietly stopped describing the same thing.
  # 0.43 preserves the old margin: ru sat +0.053 above the old bar and sits
  # +0.056 above this one. Same strictness, new scale.
  mean_score_min: 0.43      # mean qc_score per video/lang
  # 5 -> 15 on 2026-08-13. Unlike mean_score_min above this IS a loosening, and
  # a deliberate one: 5 was never met. Under the OLD metric and threshold ru
  # flagged 4 of 46 (8.7%), so the spec had never passed on real data — it was
  # aspirational, and an acceptance bar nothing can reach is one the agent
  # learns to escalate past rather than satisfy.
  # 15 says "roughly one segment in seven wanting a look is normal for a first
  # pass". It is a statement about how much review is expected, not about
  # quality; tightening qc.eval.score_flag is the other lever and changes what
  # the review page shows instead.
  # CAVEAT, live: this is a PERCENTAGE, so it is noise on a short video —
  # sketch60 has 4 segments and one flagged take is 25%. Judge small videos by
  # the flagged COUNT on the report, not by this gate.
  flagged_pct_max: 15       # % of segments below qc.eval.score_flag
  wer_bad_max: 0            # segments with backcheck WER above threshold
  overflow_max: 0           # segments that would not fit even at max_tempo
  overlap_max: 0            # segments spilling into the next utterance

budget:
  # M1 (local) budget = bounded retries. M2 adds usd/gpu-hour caps that the
  # RunPod infra agent enforces.
  max_reroll_rounds: 2      # mechanical fix rounds per video/lang

policy:
  langs: [en]               # M1 fixture scope; widen to [en, fr, de, es, ru]
  never:                    # hard rails — the agent must escalate instead
    - publish
    - delete work/
    - edit eval weights
    - edit this spec
