# dubadabidu base config. Overlays stack on top (config.gpu.yaml for the pod,
# config.<provider>.yaml for translation, config.exp.*.yaml for one-axis
# experiments). Comments say WHAT a value is; WHY lives in FINDINGS.md (§ given).

work_dir: work
output_dir: output

languages: [en, fr, de, es, ru]   # pl dropped (IMPROVEMENT_PLAN v0.3); the source is skipped
source_language: uk               # uk | ru: the spoken language of the input video

asr:
  model: large-v3            # SETTLED: turbo / v2 / Parakeet measured worse (FINDINGS §1)
  device: auto               # auto -> cuda | cpu (faster-whisper has no mps)
  backend: auto              # auto -> mlx-whisper on Apple Silicon, faster-whisper elsewhere
  # mlx_model: optional MLX repo override (default mapped from `model`)
  vad_filter: true           # faster-whisper only; mlx has none (s1 separation covers it)
  # segment merging: longer units = fewer prosody resets
  max_chars: 300
  max_seconds: 20.0
  pause_split_s: 0.6         # split at word gaps > this; the dub keeps source rhythm
  glossary_prompt: true      # inject glossary/<source_language>/*.csv terms as initial_prompt
  initial_prompt: ""         # optional extra hint, prepended

separation:
  enabled: true              # false => use the denoised original as vocals
  backend: roformer          # roformer (~12.9 dB SDR) | demucs (~9 dB, fallback)
  # device: cpu              # set if RoFormer OOMs on MPS for a long video
  roformer_model: model_bs_roformer_ep_317_sdr_12.9755.ckpt
  demucs_model: htdemucs
  # stems are cached per video: delete work/<video>/{vocals,background}.wav to redo

translation:
  # Any OpenAI-compatible endpoint (README table): DeepSeek (default), OpenAI,
  # LM Studio (response_format: json_schema), Ollama.
  base_url: https://api.deepseek.com
  # Moving alias (V4.1-Flash-1017 as of 2026-10-17). `doctor` checks it is
  # served; the answering checkpoint is recorded in manifest translation_models.
  model: deepseek-flash        # deepseek-v4-flash retired 2026-09-10 (FINDINGS §5)
  # reflect_model: deepseek-v4-pro   # stronger critic for the middle pass only
  api_key_env: TRANSLATE_API_KEY
  response_format: json_object # json_object | json_schema (LM Studio) | text
  batch_size: 20
  max_context_chars: 12000     # transcript-context cap for LOCAL endpoints only
  passes: 3                    # 1 = single; 3 = translate -> reflect -> adapt
  adequacy_check: true         # LLM-judge each final translation vs the source
  adequacy_flag: 3             # faithfulness (1-5) below this is flagged
  # adequacy_model: deepseek-v4-pro  # optional stronger judge
  # OFF — REFUTED by ear (FINDINGS §2.1q): swapped the course's own terms.
  # Needs a deterministic substitution AND a fresh ear check before re-enabling.
  avoid_mis_stressed: false
  avoid_min_marks: 1           # lexicon marks needed before a word is avoided
  isometric_tolerance: 0.10    # secondary char bound; the "seconds" slot is primary
  n_short_variants: 2          # shorter variants for overflow retries

tts:
  engine: qwen                 # qwen | edge (plumbing only, no cloning)
  engine_by_lang: {}           # per-language engine override
  # qwen_model_dir_by_lang: {} # per-language checkpoint (PLAN_v0.5 P4.5)
  reference_text: ""           # ref transcript; only the ICL path uses it
  # RU stress marks. OFF: on the base model they destroy the audio (FINDINGS
  # 2.1b); synthesize() now refuses them unless ru routes to a stress-trained
  # checkpoint. The fine-tune A/B is PLAN_v0.5 P4. Salted into synth_hash.
  ru_stress: false
  # Take SELECTION (not in synth_hash): after changing any of these, re-run
  # with --force or the cached winner is reused.
  best_of: 3                   # the pod profile ships 2
  rank_takes: true             # score all takes, pick by composite
  min_f0st: 2.2                # prefer takes above this pitch-variation floor (free)
  f0_reroll_max: 0             # extra takes if all are flat (costly, marginal: off)
  retake_mos_below: 2.6        # worst-3s-window MOS that triggers a re-roll
  best_of_early_accept: true   # stop once a take clears the bar below + fits + WER + f0
  early_accept_mos: 3.6        # chatterbox-era bar; the pod profile sets 2.8 for qwen
  early_accept_sim: 0.50       # raw ECAPA floor for early accept
  # Local default. The pod profile sets the trimmed clip that ships
  # (ref/sketch_ref_08.trim12s.wav); the choice is below the ear's resolution (§2.2).
  reference_wav: ref/sketch_ref_08.wav
  sample_rate: 24000
  edge_voices:                 # fallback engine voices (edge-tts 7.3.1)
    en: en-US-AndrewNeural
    fr: fr-FR-HenriNeural
    de: de-DE-ConradNeural
    es: es-ES-AlvaroNeural
    ru: ru-RU-DmitryNeural
    pl: pl-PL-MarekNeural
    uk: uk-UA-OstapNeural

fit:
  max_tempo: 1.12              # max speed-up (keep mild)
  soft_tempo: 1.06             # above this, prefer a shorter variant over stretching
  stretcher: auto              # auto | rubberband | atempo (auto = rubberband if ffmpeg has it)
  # soft-anchor timeline (voice-over, loose sync): a dub may start this much
  # after its source start; drift resets at real pauses.
  drift_max_s: 1.5
  min_gap_s: 0.15              # breath gap between consecutive dubs

mix:
  bg_gain_db: -6
  lufs: -16
  # duck the background under the dub (kills the residual source voice)
  duck: true
  duck_threshold: 0.03         # key level (~ -30 dB) that opens the duck
  duck_ratio: 8
  duck_attack_ms: 5
  duck_release_ms: 300
  # per-segment pure-gain level match: removes take-to-take level drift
  # without touching prosody. Applied gain lands in tr.norm_gain_db.
  segment_norm:
    enabled: true
    target_dbfs: -20.0
  # light mastering chain (pedalboard, `.[master]`, GPLv3 opt-in). Measured
  # transparent by blind ear (FINDINGS §2.0).
  master:
    enabled: true
    hpf_hz: 80
    comp_threshold_db: -18
    comp_ratio: 2.5
    comp_attack_ms: 5
    comp_release_ms: 120
    deess_hz: 7000
    deess_gain_db: -2.0
    reverb_wet: 0.0            # 0 = off
    reverb_room: 0.1
    limiter_db: -1.0

mux:
  subtitle_codec: mov_text
  lang_tags: {uk: ukr, en: eng, fr: fra, de: deu, es: spa, ru: rus, pl: pol}
  per_language: true           # also write <stem>_<lang>.mp4 (YouTube fallback)

qc:
  wer_flag_threshold: 0.15
  # cpu so scores stay comparable with everything on disk; the pod profile
  # sets cuda (measured bit-comparable, FINDINGS §3).
  metrics_device: cpu
  eval:                        # `dubadabidu evaluate` + take ranking
    # FROZEN 2026-08-13. Not because they are right: no reachable weighting of
    # these metrics agrees with the listener above chance (FINDINGS §2.1p,
    # §2.1s). qc_score is a coarse health signal, not a quality ranking.
    weights: {sim: 0.0, mos: 0.55, f0: 0.30, tempo: 0.15}
    # Behaviour-preserving cut for the worst-3s-window metric (flags the same
    # 4 of 46 as the old one). Tightening it is a review-load decision.
    score_flag: 0.36
    sim_floor_default: 0.35    # fallback if the edge floor-synth is offline
  refit:                       # `dubadabidu refit` — PROPOSES only, never applies
    min_rows: 30               # refuse below this many rated segments
    step: 0.05                 # weight lattice (weights sum to 1)
    folds: 5
    # all three gates required (each alone is defeatable, FINDINGS §2.1p)
    min_rho: 0.30
    max_p: 0.05
    permutations: 50
    adopt_margin: 0.02

prep:                          # `dubadabidu prep` reference-clip extraction
  min_s: 10.0                  # span length band (10-15 s window must be reachable)
  max_s: 20.0
  n_refs: 4
  max_candidates: 12
  # quality GATE only, not a ranker (acoustic scores don't predict clone quality)
  clip_peak: 0.99
  min_voiced: 0.25
  min_mos: 3.0

tune:                          # `dubadabidu tune` search space
  subset_size: 8
  refs_glob: ref/*.wav
  best_of: 3
  # R1's own objective (picks the CLONE SOURCE, where similarity is the
  # question). Unvalidated against the ear: R1 shortlists, the ear decides.
  r1_weights: {sim: 0.6, mos: 0.4, f0: 0.0}
  r1_takes: 3                  # rolls averaged per reference per segment
  per_video_ref_override: false  # FINDINGS §2.2: the reference is a curated asset
  override_margin: 0.05
